<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Exercise 3 </title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 30px auto;
            line-height: 1.6;
            color: #333;
        }
        .header-section, .content-section, .footer-section {
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fafafa;
        }
        .calculator-container {
            margin-top: 25px;
            padding: 15px;
            background-color: #ffffff;
            border: 1px dashed #0056b3;
            border-radius: 6px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        input[type="email"], input[type="date"], input[type="number"] {
            padding: 8px;
            width: 220px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #003d80;
        }
        output {
            font-weight: bold;
            color: #0056b3;
            font-size: 1.1em;
        }
        .subtitle {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <!-- 1. Header Section  -->
    <div class="header-section">
        <h1>UniSZA Student Inquiry Portal</h1>
        <span class="subtitle">Knowledge for the Benefit of Humanity</span>
    </div>

    <!-- 2. Content Section -->
    <div class="content-section">
        <h2>Contact Form</h2>
        
        
        <form action="#" method="post">
            <div class="form-group">
                <label for="userEmail">Email Address:</label>
                <input type="email" id="userEmail" name="userEmail" placeholder="student@unisza.edu.my" required>
            </div>

            <div class="form-group">
                <label for="contactDate">Preferred Contact Date:</label>
                <input type="date" id="contactDate" name="contactDate" required>
            </div>

            <div class="form-group">
                <label for="satisfaction">Satisfaction Level (1 to 10):</label>
                <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5">
            </div>

            <div class="form-group">
                <input type="submit" value="Submit Form">
            </div>
        </form>

        <!-- Inline Calculator  -->
        <div class="calculator-container">
            <h3>Inline Calculation Tool</h3>
            <form oninput="result.value = (parseInt(x.value) || 0) + (parseInt(y.value) || 0)">
                <label for="x" style="display:inline;">Input 1:</label>
                <input type="number" id="x" name="x" value="0">
                
                <span> + </span>
                
                <label for="y" style="display:inline;">Input 2:</label>
                <input type="number" id="y" name="y" value="0">
                
                <span> = </span>
                
                <output name="result" for="x y">0</output>
            </form>
        </div>
    </div>

    <!-- 3. Footer -->
    <div class="footer-section">
        <p>Contact us at: <a href="mailto:info@unisza.edu.my">info@unisza.edu.my</a> | Tel: +60 9-668 8888</p>
        <p>&copy; 2026 Universiti Sultan Zainal Abidin (UniSZA). All rights reserved.</p>
    </div>

</body>
</html>
